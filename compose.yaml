services:
  novods-studio:
    build: .
    restart: unless-stopped
    ports:
      - "${NOVODS_PORT:-3000}:3000"
      # Devices reply to this fixed UDP port during discovery.
      - "20116:20116/udp"
      # Some devices push screenshots back to this TCP listener.
      - "20114:20114"
    volumes:
      - studio-data:/data
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  studio-data:
